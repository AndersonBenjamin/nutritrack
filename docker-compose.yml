services:
  # Frontend estático + proxy de /api para a API.
  # Sem `ports:` de propósito: quem publica na internet é o proxy (Traefik, no
  # Coolify) e a porta fixa no host impediria duas stacks de subir juntas.
  web:
    build: ./apps/web
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./apps/api
    environment:
      # `:-` e não `:?`: no Coolify o `docker compose build` interpola o compose
      # com as variáveis de *build*, e um segredo de runtime não está lá — com
      # `:?` o build morre antes de existir. Sem valor, é o Postgres que recusa
      # subir, com mensagem clara.
      DATABASE_URL: postgresql://nutrio:${POSTGRES_PASSWORD:-}@db:5432/nutrio
      NODE_ENV: production
      PORT: 3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # nginx do container + nginx do host
      TRUST_PROXY: ${TRUST_PROXY:-2}
      # Login pelo app-labs (OIDC). Sem as três, o recurso fica desligado e o
      # login por senha continua funcionando normalmente.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      # Dieta gerada por IA (vazio = recurso desligado)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DIET_DAILY_LIMIT: ${AI_DIET_DAILY_LIMIT:-5}
      AI_DIET_MOCK: ${AI_DIET_MOCK:-false}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nutrio
      POSTGRES_USER: nutrio
      # Mesmo motivo do `DATABASE_URL`: precisa sobreviver à interpolação de build.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrio -d nutrio"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
